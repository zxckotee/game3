version: '3.8'

services:
  # PostgreSQL 16 база данных
  postgres:
    image: postgres:16
    container_name: immortal-path-postgres-prod
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Приложение (React + Express)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: immortal-path-app-prod
    ports:
      - "3000:3000"  # React production build
      - "3001:3001"  # Express API server
    volumes:
      # Монтируем только необходимые файлы для продакшена
      - ./.env.production:/app/.env:ro
    environment:
      # Переменные для продакшена
      - NODE_ENV=production
      - PORT=3001
      - REACT_APP_PORT=3000
      - REACT_APP_API_URL=https://culty.ru
      # Database - подключение к PostgreSQL контейнеру
      - USE_DATABASE=true
      - USE_MERCHANT_FILES=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=game
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - LC_ALL=C.UTF-8
      # Security для продакшена
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  # Nginx reverse proxy с SSL
  nginx:
    image: nginx:alpine
    container_name: immortal-path-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/certbot/conf:/etc/letsencrypt:ro
      - ./ssl/certbot/www:/var/www/certbot:ro
      - ./ssl/dhparam:/etc/ssl/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app_network

  # Certbot для автоматического получения и обновления SSL сертификатов
  certbot:
    image: certbot/certbot
    container_name: immortal-path-certbot
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d culty.ru -d www.culty.ru
    depends_on:
      - nginx
    networks:
      - app_network

  # Cron для автоматического обновления сертификатов
  certbot-renew:
    image: certbot/certbot
    container_name: immortal-path-certbot-renew
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - app_network

volumes:
  postgres_data_prod:
    driver: local

networks:
  app_network:
    driver: bridge