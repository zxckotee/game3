events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server app:443;
    }
    
    upstream backend {
        server app:3001;
    }
    
    upstream backend_https {
        server app:3443;
    }

    server {
        listen 80;
        server_name localhost;

        # Редирект всего HTTP трафика на HTTPS
        return 301 https://$server_name$request_uri;
    }


    # HTTPS сервер
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL сертификаты
        ssl_certificate /app/ssl/culty.ru.crt;
        ssl_certificate_key /app/ssl/culty.ru.key;

        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Проксирование API запросов через HTTPS backend
        location /api/ {
            proxy_pass https://backend_https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_verify off;
        }

        # Проксирование WebSocket для hot reload
        location /sockjs-node {
            proxy_pass https://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_ssl_verify off;
        }

        # Проксирование для webpack dev server hot reload
        location /ws {
            proxy_pass https://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_ssl_verify off;
        }

        # Все остальные запросы к React приложению
        location / {
            proxy_pass https://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_verify off;
        }
    }
}