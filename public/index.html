<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Путь к Бессмертию - браузерная игра о культивации"
    />
    <!-- Отключение кеширования -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Путь к Бессмертию</title>
    
    <!-- Принудительный редирект на HTTPS -->
    <script>
      // Проверяем, что мы используем HTTP (не HTTPS) и НЕ на localhost
      if (location.protocol === 'http:' &&
          location.hostname !== 'localhost' &&
          location.hostname !== '127.0.0.1' &&
          location.hostname !== '0.0.0.0') {
        // Перенаправляем на HTTPS версию
        location.replace('https:' + window.location.href.substring(window.location.protocol.length));
      }
    </script>
  </head>
  <body>
    <noscript>Для работы приложения необходимо включить JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
